# CAGE — single-machine deployment.
#
#   cp cage-server-0.1.1-linux-x64.tar.gz .
#   cp .env.example .env      # then edit it: passwords and MODELS_DIR
#   docker compose up -d --build
#
# Nothing is pulled from a private registry. The image is built here; mysql is
# the official public one.
#
# Everything that matters is a host folder, so it survives the container. Where
# those folders live is up to you (STATE_DIR in .env), because they must sit on a
# filesystem with Unix ownership — ext4, xfs and friends. A bind mount onto
# exFAT or NTFS fails at startup with
#   error while creating mount source path ...: chown ...: operation not permitted
# which is why STATE_DIR is separate from wherever you unpacked this.
#
#   ${STATE_DIR}/mysql    the database
#   ${STATE_DIR}/server   logic graphs, workflows, retrieval vectors
#   ${STATE_DIR}/config   config.xml and control.xml
#   ${STATE_DIR}/venvs    Python environments (multimodal workers, optional vLLM)
#   ${MODELS_DIR}         your models, mounted read-only

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cage}
      MYSQL_USER: ${MYSQL_USER:-cage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - ${STATE_DIR:-./data}/mysql:/var/lib/mysql
    # Not published by default — only the cage container needs it.
    # Uncomment to inspect the database from the host.
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cage:
    build:
      context: .
      args:
        PACKAGE: ${PACKAGE:-cage-server-0.1.1-linux-x64.tar.gz}
    image: cage:${VERSION:-0.1.1}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cage}
      MYSQL_USER: ${MYSQL_USER:-cage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NODE_TOKEN: ${NODE_TOKEN:-}
      # Take ownership of the bind mounts so you can edit config.xml from the
      # host; see .env.example.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      # safetensors models only; empty = vLLM backend disabled.
      # See doc/server/server/vllm.md for how to build it into /venvs.
      VLLM_PYTHON: ${VLLM_PYTHON:-}
    ports:
      # AI API — this is what the VSCode extension connects to.
      - "${API_PORT:-15963}:15963"
      # Control-plane web UI. Bound to localhost by default; drop the
      # 127.0.0.1 prefix only behind a TLS proxy.
      - "127.0.0.1:${WEB_PORT:-8088}:8088"
      # Node agent API. Only needed if a control plane on another machine
      # manages this node.
      # - "${AGENT_PORT:-15972}:15972"
    volumes:
      - ${STATE_DIR:-./data}/config:/config
      # Mounted at the server's own data directory, not /data: the server
      # resolves data/logic_graphs, data/workflows and data/vectors relative
      # to its working directory, so anything mounted elsewhere is ignored
      # and the graphs are lost when the container is recreated.
      - ${STATE_DIR:-./data}/server:/opt/cage/data
      - ${STATE_DIR:-./data}/venvs:/venvs
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/models:ro
      # Generated images, audio and meshes are written here.
      - ${STATE_DIR:-./data}/output:/tmp/cage
    # Models are memory-mapped and workers use shared memory; the 64 MB default
    # is far too small and shows up as an unexplained worker crash.
    shm_size: ${SHM_SIZE:-8gb}
    # Needs nvidia-container-toolkit on the host.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
