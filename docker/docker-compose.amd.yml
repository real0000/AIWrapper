# CAGE — compose for AMD / ROCm.
#
# It differs from docker-compose.yml in two things only; everything else is the
# same:
#
#   1. The base image is ubuntu:24.04 rather than nvidia/cuda. A HIP backend pack
#      carries its own ROCm runtime libraries (libamdhip64, librocblas, rocBLAS's
#      Tensile kernels …), so the CUDA base would be a dozen wasted gigabytes.
#
#   2. How the GPU is handed over. NVIDIA goes through nvidia-container-toolkit
#      (deploy.resources); ROCm does not use that at all — the kernel driver's
#      device nodes are mapped straight into the container, and the user inside
#      has to be in the groups that own them.
#
# Usage:
#
#   cp ../dist/cage-server-0.2.0-linux-x64.tar.gz  .
#   cp ../dist/cage-backend-hip-gfx1100_*.tar.gz   .    # the pack for your card
#   cp .env.example .env                                # then edit it
#   docker compose -f docker-compose.amd.yml up -d --build
#
# Check the host can see the card first: ls /dev/kfd /dev/dri
# No /dev/kfd means the amdgpu driver is not loaded, and no container setting
# will help.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cage}
      MYSQL_USER: ${MYSQL_USER:-cage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - ${STATE_DIR:-./data}/mysql:/var/lib/mysql
    # Not published by default — only the cage container needs it.
    # Uncomment to inspect the database from the host.
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cage:
    build:
      context: .
      args:
        PACKAGE: ${PACKAGE:-cage-server-0.2.0-linux-x64.tar.gz}
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
    image: cage-amd:${VERSION:-0.2.0}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cage}
      MYSQL_USER: ${MYSQL_USER:-cage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NODE_TOKEN: ${NODE_TOKEN:-}
      # Take ownership of the bind mounts so you can edit config.xml from the
      # host; see .env.example.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
    ports:
      # AI API — this is what the VSCode extension connects to.
      - "${API_PORT:-15963}:15963"
      # Control-plane web UI. Bound to localhost by default; drop the
      # 127.0.0.1 prefix only behind a TLS proxy.
      - "127.0.0.1:${WEB_PORT:-8088}:8088"
      # Node agent API. Only needed if a control plane on another machine
      # manages this node.
      # - "${AGENT_PORT:-15972}:15972"
    volumes:
      - ${STATE_DIR:-./data}/config:/config
      # Mounted at the server's own data directory, not /data: the server
      # resolves data/logic_graphs, data/workflows and data/vectors relative
      # to its working directory, so anything mounted elsewhere is ignored
      # and the graphs are lost when the container is recreated.
      - ${STATE_DIR:-./data}/server:/opt/cage/data
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/models:ro
      # Generated images, audio and meshes are written here.
      - ${STATE_DIR:-./data}/output:/tmp/cage
    # Shared memory (/dev/shm). Nothing in CAGE relies on it any more — it was for
    # the Python worker processes, which are gone — so this only sets a ceiling.
    shm_size: ${SHM_SIZE:-8gb}
    # ROCm GPU access: the kernel driver's device nodes, mapped in directly. There
    # is no runtime plugin.
    devices:
      - /dev/kfd            # ROCm's compute interface
      - /dev/dri            # DRM render node
    # The user inside the container must be in the groups that own those nodes,
    # or it can see the files but not open them — the probe then reports 0
    # devices, which looks exactly like a missing backend pack.
    group_add:
      - video
      - render
    # Some ROCm versions' HSA queues are blocked by the default seccomp profile.
    security_opt:
      - seccomp:unconfined
