# CAGE — AMD / ROCm 版的 compose。
#
# 與 docker-compose.yml 的差別只有兩件事，其餘完全相同：
#
#   ① base image 用 ubuntu:24.04 而不是 nvidia/cuda。HIP 後端包自帶 ROCm 的
#      執行期函式庫（libamdhip64 / librocblas / rocBLAS 的 Tensile kernel…），
#      所以不需要 CUDA base —— 那會白白多背十幾 GB。
#      代價：容器裡沒有 nvcc，所以不能在容器內建 Python worker 的 venv。
#      AMD 的 worker 本來就要 ROCm 版的 torch，那條路另外處理。
#
#   ② GPU 的給法。NVIDIA 走 nvidia-container-toolkit（deploy.resources），
#      ROCm 完全不走那條 —— 它是把核心驅動的裝置節點直接映射進容器，
#      使用者還必須在擁有那些節點的群組裡。
#
# 用法：
#
#   cp ../dist/cage-server-0.1.1-linux-x64.tar.gz  .
#   cp ../dist/cage-backend-hip-gfx1100_*.tar.gz   .    # 你的卡那一包
#   cp .env.example .env                                # 然後編輯它
#   docker compose -f docker-compose.amd.yml up -d --build
#
# 先確認主機看得到卡：ls /dev/kfd /dev/dri
# 沒有 /dev/kfd 就是 amdgpu 驅動沒載入，容器再怎麼設定都沒用。

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cage}
      MYSQL_USER: ${MYSQL_USER:-cage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - ${STATE_DIR:-./data}/mysql:/var/lib/mysql
    # Not published by default — only the cage container needs it.
    # Uncomment to inspect the database from the host.
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cage:
    build:
      context: .
      args:
        PACKAGE: ${PACKAGE:-cage-server-0.1.1-linux-x64.tar.gz}
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
    image: cage-amd:${VERSION:-0.1.1}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cage}
      MYSQL_USER: ${MYSQL_USER:-cage}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      NODE_TOKEN: ${NODE_TOKEN:-}
      # Take ownership of the bind mounts so you can edit config.xml from the
      # host; see .env.example.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      # safetensors models only; empty = vLLM backend disabled.
      # See doc/server/server/vllm.md for how to build it into /venvs.
      VLLM_PYTHON: ${VLLM_PYTHON:-}
    ports:
      # AI API — this is what the VSCode extension connects to.
      - "${API_PORT:-15963}:15963"
      # Control-plane web UI. Bound to localhost by default; drop the
      # 127.0.0.1 prefix only behind a TLS proxy.
      - "127.0.0.1:${WEB_PORT:-8088}:8088"
      # Node agent API. Only needed if a control plane on another machine
      # manages this node.
      # - "${AGENT_PORT:-15972}:15972"
    volumes:
      - ${STATE_DIR:-./data}/config:/config
      # Mounted at the server's own data directory, not /data: the server
      # resolves data/logic_graphs, data/workflows and data/vectors relative
      # to its working directory, so anything mounted elsewhere is ignored
      # and the graphs are lost when the container is recreated.
      - ${STATE_DIR:-./data}/server:/opt/cage/data
      - ${STATE_DIR:-./data}/venvs:/venvs
      - ${MODELS_DIR:?set MODELS_DIR in .env}:/models:ro
      # Generated images, audio and meshes are written here.
      - ${STATE_DIR:-./data}/output:/tmp/cage
    # Models are memory-mapped and workers use shared memory; the 64 MB default
    # is far too small and shows up as an unexplained worker crash.
    shm_size: ${SHM_SIZE:-8gb}
    # ROCm 的 GPU 存取：直接映射核心驅動的裝置節點，沒有 runtime plugin。
    devices:
      - /dev/kfd            # ROCm 的運算介面
      - /dev/dri            # DRM render node
    # 容器內的使用者要在擁有上面那些節點的群組裡，否則會是「看得到檔案、
    # 打不開」—— 症狀是 probe 回報 0 個裝置，跟「沒裝後端包」長得一樣。
    group_add:
      - video
      - render
    # 部分 ROCm 版本的 HSA queue 會被預設的 seccomp profile 擋下。
    security_opt:
      - seccomp:unconfined
